<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dossierCss/style.css">
    <title>Connexion</title>
</head>

<body>


    <div class="formulaire">

        <div class="titre">
            <h2>Formulaire de connexion</h2>
            <span>Verification des information des utilisateur</span>
        </div>



     <form id="formulaireConnexion">

            <div class="username" id="username">

                <label class="identifiant" id="identifiant" >Username/ Matricule</label>
                <input type="text" id="user_name" placeholder="Entrez votre nom d'utilisateur" required>

            </div>
 
            <div class="password" id="password">
                <label for="mot_passee">Mot de passe</label>
                <input type="password" id="champMotDePasse" placeholder="••••••••" required>
                <div class="message-erreur" id="messageErreur"></div>
            </div>
 
            <button type="submit" class="bouton-connexion">Se connecter</button>
        </form>
    
        <script src="../dossierJS/login.js"></script>

    </div>


</body>

</html>
