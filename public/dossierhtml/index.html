<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dossierCss/style.css">
    <title>Connexion</title>
</head>

<body>


    <div class="formulaire">

        <div class="titre">
            <h2>Formulaire de connexion</h2>
            <span>Veriffication des information des utilisateur</span>
        </div>


        <div class="selecteur-profil">

            <div class="curseur" id="curseur"></div>
            <button type="button" class="bouton_admin" >Admin</button>
            <button type="button" class="bouton_prof" >professeur</button>
            <button type="button" class="bouton_etudiant" >Étudiant</button>

        </div>


     <form id="formulaireConnexion">

            <div class="username">

                <label class="identifiant" id="identifiant" >Nom d'utilisateur</label>
                <input type="text" id="user_name" placeholder="Entrez votre nom d'utilisateur" required>

            </div>
 
            <div class="password">
                <label for="mot_passee">Mot de passe</label>
                <input type="password" id="champMotDePasse" placeholder="••••••••" required>
                <div class="message-erreur" id="messageErreur"></div>
            </div>
 
            <button type="submit" class="bouton-connexion">Se connecter</button>
        </form>
    
        <script src="../dossierJS/admin.js"></script>

    </div>


</body>

</html>
